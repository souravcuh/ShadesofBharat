<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Bharat geographic base map</title>
<desc id="desc">Generalized outline map of India used as the base layer for the interactive Tirtha atlas.</desc>
<metadata>Outline geometry adapted from the India GeoJSON distributed with the MIT-licensed countryinfo dataset. This is a generalized locator map, not an official political boundary map.</metadata>
