    <stop stop-color="#ead3a0"/>
    <stop offset=".52" stop-color="#f8ebca"/>
    <stop offset="1" stop-color="#dfbc78"/>
  </linearGradient>
  <radialGradient id="land" cx=".48" cy=".4" r=".7">
    <stop stop-color="#fff0cc"/>
    <stop offset="1" stop-color="#dfbb78"/>
  </radialGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 .05"/></feComponentTransfer>
  </filter>
</defs>
<rect width="1200" height="900" fill="url(#paper)"/>
<rect width="1200" height="900" filter="url(#grain)" opacity=".65"/>
